<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosewood — CRM Build Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Libre+Baskerville:ital@0;1&display=swap');
:root {
  --rw-red:#A92F3D; --rw-red-dark:#8E2733; --rw-red-soft:#F5E6E8;
  --birch:#E4E0D5; --dogwood:#F1EEE3; --bark:#493B32; --wood-chips:#5D4D41;
  --mushroom:#736253; --stump:#291F1D; --deerskin:#AE9661;
  --surface-page:#F9F7F1; --surface-card:#FFFFFF; --surface-sunken:var(--dogwood);
  --surface-tint:#FCFAF4; --hd-bg:rgba(249,247,241,.9);
  --ink:var(--bark); --ink-2:var(--wood-chips); --ink-3:#8A7B6C;
  --border:#E9E4D8; --border-strong:#D5CDBB;
  --accent:var(--rw-red); --focus-ring:rgba(169,47,61,.4);
  --good:#3E7A34; --good-bg:#EAF2E6;
  --warn:#B47B0E; --warn-bg:#F9F0DC;
  --gold-wash:#F7F2E2; --gold-ink:#6E5B2F; --gold-line:#D8C48C; --gold-dot:#BFA45E;
  --font-ui:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-serif:'Libre Baskerville',Georgia,serif;
  --fs-xs:11px; --fs-s:12px; --fs-m:13px; --fs-body:14px; --fs-l:16px;
  --fs-xl:18px; --fs-2xl:22px; --fs-3xl:28px;
  --r-s:7px; --r-m:10px; --r-l:14px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(41,31,29,.04),0 1px 3px rgba(41,31,29,.05);
  --sh-2:0 4px 14px rgba(41,31,29,.08);
  --sh-3:0 16px 40px rgba(41,31,29,.16);
  color-scheme:light;
}
/* ── Dark theme — warm, brand-consistent. Cards sit lighter than the page for depth. ── */
:root[data-theme="dark"]{
  color-scheme:dark;
  --rw-red:#C6414F; --rw-red-dark:#A93340; --rw-red-soft:#3A2320;
  --dogwood:#322822;
  --surface-page:#1C1613; --surface-card:#282019; --surface-sunken:#221A15;
  --surface-tint:#2E251D; --hd-bg:rgba(28,22,19,.9);
  --ink:#ECE5D8; --ink-2:#C7BBA9; --ink-3:#9A8C79;
  --border:#3A2F27; --border-strong:#4C3F34;
  --accent:var(--rw-red); --focus-ring:rgba(198,65,79,.5);
  --good:#82BB70; --good-bg:#26301F; --warn:#D9A441; --warn-bg:#33280F;
  --gold-wash:#2F2717; --gold-ink:#E4C97F; --gold-line:#6E5A2E; --gold-dot:#C9A94E;
  --sh-1:0 1px 2px rgba(0,0,0,.24),0 1px 3px rgba(0,0,0,.3);
  --sh-2:0 4px 14px rgba(0,0,0,.34); --sh-3:0 16px 40px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    color-scheme:dark;
    --rw-red:#C6414F; --rw-red-dark:#A93340; --rw-red-soft:#3A2320;
    --dogwood:#322822;
    --surface-page:#1C1613; --surface-card:#282019; --surface-sunken:#221A15;
    --surface-tint:#2E251D; --hd-bg:rgba(28,22,19,.9);
    --ink:#ECE5D8; --ink-2:#C7BBA9; --ink-3:#9A8C79;
    --border:#3A2F27; --border-strong:#4C3F34;
    --accent:var(--rw-red); --focus-ring:rgba(198,65,79,.5);
    --good:#82BB70; --good-bg:#26301F; --warn:#D9A441; --warn-bg:#33280F;
    --gold-wash:#2F2717; --gold-ink:#E4C97F; --gold-line:#6E5A2E; --gold-dot:#C9A94E;
    --sh-1:0 1px 2px rgba(0,0,0,.24),0 1px 3px rgba(0,0,0,.3);
    --sh-2:0 4px 14px rgba(0,0,0,.34); --sh-3:0 16px 40px rgba(0,0,0,.5);
  }
}
/* Client-facing surfaces always render light — a proposal should look like paper. */
.rpt-screen, .bp-wrap{
  --surface-page:#F9F7F1; --surface-card:#FFFFFF; --surface-sunken:#F1EEE3;
  --surface-tint:#FCFAF4; --dogwood:#F1EEE3;
  --ink:#493B32; --ink-2:#5D4D41; --ink-3:#8A7B6C;
  --border:#E9E4D8; --border-strong:#D5CDBB;
  --rw-red:#A92F3D; --rw-red-dark:#8E2733; --rw-red-soft:#F5E6E8; --accent:#A92F3D;
  --good:#3E7A34; --good-bg:#EAF2E6; --warn:#B47B0E; --warn-bg:#F9F0DC;
  --gold-wash:#F7F2E2; --gold-ink:#6E5B2F; --gold-line:#D8C48C; --gold-dot:#BFA45E;
  --sh-1:0 1px 2px rgba(41,31,29,.04),0 1px 3px rgba(41,31,29,.05);
  --sh-2:0 4px 14px rgba(41,31,29,.08); --sh-3:0 16px 40px rgba(41,31,29,.16);
  background:var(--surface-page); color:var(--ink);
}
/* Theme toggle (header) */
.theme-seg{display:inline-flex;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-pill);padding:2px;gap:1px}
.theme-seg button{display:inline-flex;align-items:center;justify-content:center;width:28px;height:24px;border:0;background:none;color:var(--ink-3);border-radius:var(--r-pill);cursor:pointer;padding:0}
.theme-seg button:hover{color:var(--ink)}
.theme-seg button.is-active{background:var(--surface-sunken);color:var(--ink)}
.theme-seg .ico{width:15px;height:15px}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-ui);font-size:var(--fs-body);line-height:1.5;color:var(--ink);background:var(--surface-page);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;color:var(--ink)}
button{font-family:var(--font-ui)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:2px}
::selection{background:var(--rw-red-soft)}
@keyframes rw-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#page.anim>*{animation:rw-in .26s ease both}
.ico{width:14px;height:14px;flex:0 0 auto}
.dz-donut{flex:0 0 auto;transform:rotate(-90deg)}

/* ── Header ── */
.hd{background:var(--hd-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;height:56px}
.hd-logo{font-family:var(--font-serif);font-style:italic;font-size:22px;color:var(--ink);line-height:1;background:none;border:0;cursor:pointer;padding:4px 2px}
.hd-logo .accent{color:var(--rw-red)}
.hd-crumb{font-size:var(--fs-m);color:var(--ink-3);display:flex;align-items:center;gap:8px}
.hd-crumb .sep{color:var(--border-strong)}
.hd-crumb b{color:var(--ink-2);font-weight:600}
.hd .spacer{margin-left:auto}
.hd-client{display:inline-flex;align-items:center;gap:9px;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-pill);padding:5px 14px 5px 6px;cursor:pointer;font-size:var(--fs-m);font-weight:600;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.hd-client:hover{border-color:var(--border-strong);box-shadow:var(--sh-1)}
.hd-client .av{width:24px;height:24px;border-radius:50%;background:var(--bark);color:var(--birch);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.hd-client .pl{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.hd-client .chev{color:var(--ink-3);font-size:10px}

/* ── Buttons ── */
.btn{font-size:var(--fs-m);font-weight:600;border-radius:var(--r-s);padding:8px 16px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.3;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .06s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{background:var(--rw-red);color:#fff}
.btn-primary:hover{background:var(--rw-red-dark)}
.btn-secondary{background:var(--surface-card);color:var(--ink);border-color:var(--border-strong)}
.btn-secondary:hover{border-color:var(--mushroom);box-shadow:var(--sh-1)}
.btn-ghost{background:transparent;color:var(--ink-2);border:0}
.btn-ghost:hover{background:var(--dogwood);color:var(--ink)}
.btn-ghost.danger:hover{color:var(--rw-red);background:var(--rw-red-soft)}
.btn-sm{padding:6px 12px;font-size:var(--fs-s)}
.btn-lg{padding:12px 26px;font-size:var(--fs-l)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--ink-3);font-size:var(--fs-s);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:2px}
.link:hover{color:var(--ink)}

/* ── Inputs ── */
.in{font-family:var(--font-ui);font-size:var(--fs-body);color:var(--ink);background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--r-s);padding:9px 12px;width:100%;transition:border-color .15s}
.in:focus{border-color:var(--rw-red);outline:none;box-shadow:0 0 0 3px var(--focus-ring)}
.in.money{width:110px;text-align:right}
.in.error{border-color:var(--rw-red);animation:rw-shake .16s ease 2}
.fld .err{font-size:var(--fs-xs);color:var(--rw-red);font-weight:600}
@keyframes rw-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:var(--fs-s);font-weight:600;color:var(--ink-2)}
.sec-label{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}

/* ── Chips ── */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:var(--r-pill);padding:2px 10px;white-space:nowrap}
.chip.neutral{background:var(--dogwood);color:var(--ink-2)}
.chip.gold{background:var(--gold-wash);color:var(--gold-ink);border:1px solid var(--gold-line)}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.plain{background:transparent;border:1px solid var(--border);color:var(--ink-3)}

/* ── Page shells ── */
.page{max-width:1240px;margin:0 auto;padding:32px 28px 90px}
.page.wide{max-width:1460px}
.page.narrow{max-width:760px}
.intro{margin-bottom:26px}
.intro h1{font-size:var(--fs-3xl);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.intro p{margin:5px 0 0;color:var(--ink-3);max-width:620px}
.crumb-back{background:none;border:0;color:var(--ink-3);font-size:var(--fs-m);cursor:pointer;padding:4px 0;margin-bottom:14px;display:inline-flex;gap:6px;align-items:center}
.crumb-back:hover{color:var(--ink)}

/* ── Home ── */
.home{max-width:840px;margin:0 auto;padding:9vh 24px 80px}
.home-hero{text-align:center;margin-bottom:56px}
.home-hero .mark{font-family:var(--font-serif);font-style:italic;font-size:40px;color:var(--ink)}
.home-hero .mark .accent{color:var(--rw-red)}
.home-hero .sub{font-size:var(--fs-l);color:var(--ink-3);margin-top:6px}
.home-hero .cta{margin-top:30px}
.home-list-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.home-list-head .n{font-size:var(--fs-s);color:var(--ink-3)}
.cl-table{width:100%;border-collapse:collapse;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden;box-shadow:var(--sh-1)}
.cl-table th{text-align:left;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:11px 16px;border-bottom:1px solid var(--border);background:var(--surface-tint)}
.cl-table th.num{text-align:right}
.cl-table td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:var(--fs-m)}
.cl-table tr:last-child td{border-bottom:0}
.cl-table tbody tr{cursor:pointer;transition:background .12s}
.cl-table tbody tr:hover{background:var(--surface-tint)}
.cl-table .nm{font-weight:700;font-size:var(--fs-body);display:block;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-table .co{color:var(--ink-3);font-size:var(--fs-s)}
.cl-table td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cl-table td.num .dim{color:var(--ink-3)}
.cl-table .row-del{background:none;border:0;color:transparent;font-size:15px;cursor:pointer;padding:2px 6px;border-radius:4px}
.cl-table tbody tr:hover .row-del{color:var(--ink-3)}
.cl-table .row-del:hover{color:var(--rw-red);background:var(--rw-red-soft)}
.cl-table .go{color:var(--border-strong);font-size:14px}
.cl-table tbody tr:hover .go{color:var(--ink-3)}
.home-empty{text-align:center;color:var(--ink-3);padding:46px 20px;background:var(--surface-card);border:1px dashed var(--border-strong);border-radius:var(--r-m);font-size:var(--fs-m)}
.home-foot{text-align:center;margin-top:40px}
.home-open{max-width:560px;margin:0 auto}
.home-search{display:flex;align-items:center;gap:10px;background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--r-pill);padding:10px 14px;box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .15s}
.home-search:focus-within{border-color:var(--rw-red);box-shadow:0 0 0 3px var(--focus-ring)}
.home-search .ico{width:17px;height:17px;color:var(--ink-3);flex:0 0 auto}
.home-search input{flex:1;border:0;background:none;outline:none;font-family:var(--font-ui);font-size:var(--fs-l);color:var(--ink);min-width:0}
.home-search input::placeholder{color:var(--ink-3)}
.home-clear{background:none;border:0;color:var(--ink-3);font-size:20px;cursor:pointer;line-height:1;padding:0 4px;flex:0 0 auto;border-radius:50%}
.home-clear:hover{color:var(--ink)}
.home-results{margin-top:16px;min-height:44px}
.home-hint{text-align:center;color:var(--ink-3);font-size:var(--fs-m);padding:18px 10px}
.home-hint .dim{color:var(--border-strong)}
table.cl-table.rounded{border-radius:var(--r-m)}

/* ── Intake / quiz ── */
.qz-progress{position:fixed;top:56px;left:0;right:0;height:3px;background:var(--border);z-index:49}
.qz-progress .fill{height:100%;background:var(--rw-red);transition:width .3s ease}
.qz{max-width:620px;margin:0 auto;padding:11vh 24px 80px}
.qz .eyebrow{font-size:var(--fs-s);font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:10px}
.qz h2{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.18}
.qz .why{color:var(--ink-3);margin:8px 0 0;font-size:var(--fs-body)}
.qz-opts{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.qz-opt{text-align:left;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-m);padding:15px 18px;cursor:pointer;font-size:var(--fs-body);color:var(--ink);display:flex;align-items:center;gap:12px;transition:border-color .15s,box-shadow .15s,transform .05s}
.qz-opt:hover{border-color:var(--border-strong);box-shadow:var(--sh-1)}
.qz-opt:active{transform:scale(.995)}
.qz-opt.sel{border-color:var(--rw-red);background:var(--surface-tint);box-shadow:0 0 0 1px var(--rw-red)}
.qz-opt .k{width:24px;height:24px;border-radius:6px;border:1px solid var(--border-strong);color:var(--ink-3);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.qz-opt.sel .k{background:var(--rw-red);border-color:var(--rw-red);color:#fff}
.qz-opt .d{display:block;font-size:var(--fs-s);color:var(--ink-3);font-weight:400;margin-top:1px}
.qz-opt b{font-weight:600}
.qz-fields{display:flex;flex-direction:column;gap:16px;margin-top:28px}
.qz-nav{display:flex;align-items:center;gap:12px;margin-top:34px}
.qz-nav .spacer{margin-left:auto}
.qz-hint{font-size:var(--fs-s);color:var(--ink-3);margin-top:14px}
.qz-result{text-align:center;padding-top:4vh}
.qz-result .pkg-name{font-family:var(--font-serif);font-style:italic;font-size:44px;margin:18px 0 6px}
.qz-result .because{max-width:440px;margin:14px auto 0;color:var(--ink-2);font-size:var(--fs-body)}
.qz-result .acts{margin-top:32px;display:flex;gap:12px;justify-content:center}

/* ── Plans ── */
.pp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
@media(max-width:980px){.pp-grid{grid-template-columns:1fr}}
.pp-card{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--sh-1);position:relative;display:flex;flex-direction:column;transition:box-shadow .2s,border-color .2s}
.pp-card:hover{box-shadow:var(--sh-2)}
.pp-card.is-selected{border-color:var(--rw-red);box-shadow:0 0 0 1px var(--rw-red),var(--sh-2)}
.pp-flag{position:absolute;top:-11px;left:20px;background:var(--bark);color:var(--birch);font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r-pill);padding:3px 12px}
.pp-flag.rec{background:var(--rw-red);color:#fff}
.pp-card-body{padding:22px 22px 18px;display:flex;flex-direction:column;gap:15px;flex:1}
.pp-card h2{font-size:var(--fs-2xl);font-weight:700;margin-top:4px}
.pp-tag{font-size:var(--fs-m);color:var(--ink-3);margin-top:2px}
.pp-price .from{font-size:var(--fs-s);color:var(--ink-3);font-weight:600}
.pp-price .amt{font-size:32px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.pp-price .per{font-size:var(--fs-m);color:var(--ink-2);margin-top:2px}
.pp-price .weeks{font-size:var(--fs-s);color:var(--ink-3);margin-top:2px}
.pp-bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.pp-bullets li{font-size:var(--fs-m);display:flex;gap:9px;line-height:1.45}
.pp-bullets li::before{content:"✓";color:var(--good);font-weight:700;flex:0 0 auto}
.pp-bullets li b{font-weight:600}
.pp-total{margin-top:auto;border-top:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;gap:12px}
.pp-total .setup{font-size:var(--fs-l);font-weight:700;font-variant-numeric:tabular-nums}
.pp-total .mo{font-size:var(--fs-s);color:var(--ink-2)}
.pp-total .addon-note{font-size:var(--fs-xs);color:var(--ink-3)}
.pp-select{margin-left:auto;background:var(--rw-red);color:#fff;border:0;border-radius:var(--r-s);font-size:var(--fs-m);font-weight:600;padding:8px 16px;cursor:pointer;white-space:nowrap;transition:background .15s,transform .06s}
.pp-select:active{transform:translateY(1px)}
.pp-select:hover{background:var(--rw-red-dark)}
.pp-select.is-on{background:var(--bark)}
.pp-rules{margin-top:30px}
.pp-rules summary{cursor:pointer;font-size:var(--fs-s);font-weight:600;color:var(--ink-3);list-style:none;display:inline-flex;gap:6px}
.pp-rules summary::-webkit-details-marker{display:none}
.pp-rules summary:hover{color:var(--ink)}
.pp-rules .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.pp-rule{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-m);padding:12px 14px}
.pp-rule .t{font-weight:700;font-size:var(--fs-s);margin-bottom:2px}
.pp-rule .d{font-size:var(--fs-s);color:var(--ink-3);line-height:1.45}
.pp-more{margin-top:22px;text-align:center}

/* ── Add-ons panel / milestones / switches / qty (shared) ── */
.pp-autos{border:1px solid var(--border);border-radius:var(--r-m);padding:12px 14px;background:var(--surface-tint)}
.pp-autos .head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.pp-autos .head .n{font-weight:700;font-size:var(--fs-m)}
.pp-autos .head .inc{font-size:var(--fs-s);color:var(--ink-3);margin-left:auto}
.pp-token-row{display:flex;align-items:center;gap:12px;padding:7px 0}
.pp-token-row + .pp-token-row{border-top:1px dashed var(--border)}
.pp-token-row .lblwrap{flex:1;min-width:0}
.pp-token-row .lbl{font-size:var(--fs-s);color:var(--ink-2);font-weight:600;display:block}
.pp-token-row .note{font-size:var(--fs-xs);color:var(--ink-3);display:block}
.pp-token-row .cost{font-size:var(--fs-s);font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 74px;text-align:right}
.pp-token-row .cost.zero{color:var(--ink-3);font-weight:400}
.pp-autos .foot{margin-top:6px;padding-top:8px;border-top:1px solid var(--border);font-size:var(--fs-s);color:var(--ink-3);display:flex;justify-content:flex-end}
.pp-autos .foot b{color:var(--ink);font-variant-numeric:tabular-nums;margin-left:5px}
.pp-qty{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:var(--r-s);background:var(--surface-card);overflow:hidden;flex:0 0 auto}
.pp-qty button{width:26px;height:26px;border:0;background:var(--surface-card);color:var(--ink-2);font-size:15px;font-weight:700;cursor:pointer;line-height:1;padding:0}
.pp-qty button:hover{background:var(--dogwood);color:var(--ink)}
.pp-qty input{width:44px;height:26px;border:0;border-left:1px solid var(--border);border-right:1px solid var(--border);text-align:center;font-family:var(--font-ui);font-size:var(--fs-m);font-weight:600;color:var(--ink);-moz-appearance:textfield}
.pp-qty input::-webkit-outer-spin-button,.pp-qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pp-qty input:focus{outline:none;background:var(--rw-red-soft)}
.pp-switch{position:relative;width:32px;height:18px;flex:0 0 auto;cursor:pointer}
.pp-switch input{opacity:0;width:0;height:0;position:absolute}
.pp-switch .tr{position:absolute;inset:0;background:var(--border-strong);border-radius:var(--r-pill);transition:background .15s}
.pp-switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.pp-switch input:checked + .tr{background:var(--good)}
.pp-switch input:checked + .tr::after{left:16px}
.pp-miles{border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden}
.pp-miles summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:var(--fs-m);background:var(--surface-sunken);list-style:none;display:flex;align-items:center;gap:8px}
.pp-miles summary::-webkit-details-marker{display:none}
.pp-miles summary .chev{margin-left:auto;transition:transform .15s;color:var(--ink-3);font-size:11px}
.pp-miles[open] summary .chev{transform:rotate(180deg)}
.pp-mile{padding:10px 14px;border-top:1px solid var(--border)}
.pp-mile .m-name{font-weight:700;font-size:var(--fs-s);color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.pp-mile .m-step{color:var(--ink-3);font-weight:600}
.pp-mile ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.pp-mile li{font-size:var(--fs-m);color:var(--ink-2);display:flex;align-items:center;gap:8px}
.pp-mile li .tick{color:var(--border-strong);font-size:11px}
.pp-opt{display:flex;align-items:center;gap:8px;width:100%}
.pp-opt .price{margin-left:auto;font-size:var(--fs-s);font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.pp-opt.on .price{color:var(--good)}

/* ── Builder ── */
.dz-bar{position:sticky;top:56px;z-index:40;background:var(--hd-bg);backdrop-filter:blur(8px);display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:22px}
.dz-stat{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-m);color:var(--ink-2)}
.dz-stat b{font-variant-numeric:tabular-nums;color:var(--ink)}
.dz-stat .tok-ico{width:13px;height:13px;border-radius:50%;background:var(--gold-dot);border:1.5px solid var(--gold-ink);flex:0 0 auto}
.dz-stat.over{color:var(--warn);font-weight:600}
.dz-stat.over b{color:var(--warn)}
.dz-bar .money{font-size:var(--fs-m);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dz-bar .money .mo{color:var(--ink-3);font-weight:400}
.dz-bar .right{margin-left:auto;display:inline-flex;gap:9px;align-items:center}
.dz-extra{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-s);color:var(--ink-2);padding:3px 4px 3px 10px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface-card)}
.dz-extra.is-manual{border-color:var(--gold-line);background:var(--gold-wash)}
.dz-extra .lbl{font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-size:var(--fs-xs)}
.dz-extra .pp-qty{border-color:var(--border-strong)}
.mini-reset{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:var(--fs-s);padding:0 4px;line-height:1}
.mini-reset:hover{color:var(--rw-red)}
/* Leads Inbox — special single-list element */
.dz-lane.dz-inbox{border-style:dashed;border-color:var(--border-strong);background:var(--surface-tint)}
.dz-inbox-badge{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--r-pill);padding:2px 9px;flex:0 0 auto}
.dz-addon-badge{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gold-ink);background:var(--gold-wash);border:1px solid var(--gold-line);border-radius:var(--r-pill);padding:2px 9px;flex:0 0 auto;white-space:nowrap}
.dz-inbox-note{font-size:var(--fs-s);color:var(--ink-3);font-style:italic;margin:2px 2px 10px}
.dz-inbox-chips{display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start}
.dz-inbox-chips .dz-chip{width:auto;flex:0 1 auto}
.dz-inbox-chips .dz-add-auto{width:auto}
.dz-lane{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--sh-1);padding:14px 18px 16px}
.dz-lane-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dz-lane-head input.pl-name{font-family:var(--font-ui);font-size:var(--fs-l);font-weight:700;color:var(--ink);border:1px solid transparent;background:transparent;border-radius:var(--r-s);padding:2px 6px;min-width:120px;width:260px}
.dz-lane-head input.pl-name:hover{border-color:var(--border)}
.dz-lane-head input.pl-name:focus{border-color:var(--rw-red);outline:none;background:var(--surface-card)}
.dz-lane-head .meta{font-size:var(--fs-s);color:var(--ink-3);white-space:nowrap}
.dz-lane-head .pl-del{margin-left:auto;background:none;border:0;color:var(--border-strong);font-size:16px;cursor:pointer;padding:2px 6px;visibility:hidden}
.dz-lane:hover .pl-del{visibility:visible}
.dz-lane-head .pl-del:hover{color:var(--rw-red)}
.dz-stages{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:2px 0 8px}
.dz-stage{flex:1 0 195px;min-width:195px;max-width:280px;background:var(--surface-tint);border:1px solid var(--border-strong);border-radius:var(--r-m);padding:10px 12px;display:flex;flex-direction:column;gap:7px;position:relative}
.dz-stage-head{display:flex;align-items:center;gap:4px}
.dz-stage-head input.st-name{font-family:var(--font-ui);font-size:var(--fs-m);font-weight:700;color:var(--ink);border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 4px;width:100%;min-width:0}
.dz-stage-head input.st-name:hover{border-color:var(--border)}
.dz-stage-head input.st-name:focus{border-color:var(--rw-red);outline:none;background:var(--surface-card)}
.dz-stage-head .st-del{background:none;border:0;color:var(--border-strong);font-size:14px;cursor:pointer;padding:0 3px;visibility:hidden;flex:0 0 auto}
.dz-stage:hover .st-del{visibility:visible}
.dz-stage-head .st-del:hover{color:var(--rw-red)}
textarea.st-note{font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--ink-3);background:transparent;border:1px solid transparent;border-radius:4px;padding:2px 4px;width:100%;resize:none;line-height:1.4;min-height:20px;overflow:hidden}
textarea.st-note:hover{border-color:var(--border)}
textarea.st-note:focus{border-color:var(--rw-red);outline:none;background:var(--surface-card);color:var(--ink-2)}
.dz-autos{display:flex;flex-direction:column;gap:5px;flex:1}
.dz-chip{display:flex;align-items:center;gap:7px;border-radius:var(--r-s);padding:5px 8px;font-size:var(--fs-s);font-weight:600;cursor:pointer;border:1px solid var(--gold-line);background:var(--gold-wash);color:var(--gold-ink);text-align:left;width:100%;transition:border-color .12s}
.dz-chip .tok{width:12px;height:12px;border-radius:50%;background:var(--gold-dot);border:1.5px solid var(--gold-ink);flex:0 0 auto}
.dz-chip .nm{flex:1;min-width:0;line-height:1.3}
.dz-chip .x{color:var(--ink-3);font-size:13px;visibility:hidden;flex:0 0 auto;padding:0 1px}
.dz-chip:hover .x{visibility:visible}
.dz-chip .x:hover{color:var(--rw-red)}
.dz-chip.off{background:var(--surface-card);border:1px dashed var(--border-strong);color:var(--ink-3);font-weight:400}
.dz-chip.off .tok{background:transparent;border:1.5px dashed var(--border-strong)}
.dz-chip:hover{border-color:var(--deerskin)}
.dz-add-auto{background:none;border:1px dashed var(--border-strong);color:var(--ink-3);font-size:var(--fs-xs);font-weight:600;border-radius:var(--r-s);padding:4px 8px;cursor:pointer;width:100%;text-align:left}
.dz-add-auto:hover{color:var(--ink);border-color:var(--deerskin)}
.dz-arrow{align-self:center;color:var(--border-strong);font-size:20px;padding:0 5px;flex:0 0 auto;user-select:none}
.dz-stage-add{flex:0 0 44px;min-width:44px;border:1px dashed var(--border-strong);border-radius:var(--r-m);background:none;color:var(--ink-3);font-size:18px;cursor:pointer;align-self:stretch}
.dz-stage-add:hover{color:var(--ink);border-color:var(--deerskin)}
.dz-inflow{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 0;color:var(--ink-3);font-size:var(--fs-s)}
.dz-inflow .ar{font-size:16px;color:var(--border-strong)}
.dz-inflow input{font-family:var(--font-ui);font-size:var(--fs-s);font-style:italic;color:var(--ink-3);background:transparent;border:1px solid transparent;border-radius:4px;padding:2px 6px;width:min(480px,80%);text-align:center}
.dz-inflow input:hover{border-color:var(--border)}
.dz-inflow input:focus{border-color:var(--rw-red);outline:none;background:var(--surface-card);font-style:normal;color:var(--ink)}
.dz-inflow .txt{font-style:italic}
.dz-pl-add{display:block;margin:16px auto 0;background:none;border:1px dashed var(--border-strong);color:var(--ink-3);font-size:var(--fs-s);font-weight:600;border-radius:var(--r-s);padding:7px 16px;cursor:pointer}
.dz-pl-add:hover{color:var(--ink);border-color:var(--deerskin)}
.dz-incl{background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-m);box-shadow:var(--sh-2);padding:16px 18px;margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:800px){.dz-incl{grid-template-columns:1fr}}

.hint-callout{display:flex;gap:12px;align-items:flex-start;background:var(--gold-wash);border:1px solid var(--gold-line);border-radius:var(--r-m);padding:12px 16px;font-size:var(--fs-s);color:var(--gold-ink);margin-bottom:16px;line-height:1.5}
.hint-callout b{color:inherit}
.hint-callout .ok{margin-left:auto;flex:0 0 auto;background:none;border:1px solid var(--gold-line);border-radius:var(--r-s);color:var(--gold-ink);font-size:var(--fs-xs);font-weight:700;padding:4px 12px;cursor:pointer}
.hint-callout .ok:hover{background:var(--surface-card)}

/* ── Automation picker modal ── */
.dz-scrim{position:fixed;inset:0;z-index:95;background:rgba(41,31,29,.28)}
.dz-modal{position:fixed;z-index:96;top:12vh;left:50%;transform:translateX(-50%);width:390px;max-width:92vw;background:var(--surface-card);border-radius:var(--r-m);box-shadow:var(--sh-3);max-height:68vh;display:flex;flex-direction:column;overflow:hidden}
.dz-modal .hd2{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.dz-modal .hd2 .t{font-weight:700;font-size:var(--fs-body)}
.dz-modal .hd2 .close{margin-left:auto;background:none;border:0;color:var(--ink-3);font-size:18px;cursor:pointer;padding:0 4px}
.dz-modal .hd2 .close:hover{color:var(--ink)}
.dz-modal .bd{overflow:auto;padding:6px 0 10px}
.dz-modal .grp{font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:10px 16px 4px}
.dz-modal .it{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 16px;cursor:pointer}
.dz-modal .it:hover{background:var(--dogwood)}
.dz-modal .it .tok{width:12px;height:12px;border-radius:50%;background:var(--gold-dot);border:1.5px solid var(--gold-ink);flex:0 0 auto;margin-top:3px}
.dz-modal .it .nm{font-size:var(--fs-m);font-weight:600;color:var(--ink);display:block}
.dz-modal .it .d{font-size:var(--fs-xs);color:var(--ink-3);display:block;line-height:1.4}
.dz-modal .it.added{opacity:.45;cursor:default}
.dz-modal .it.added:hover{background:none}
.dz-modal .it .got{margin-left:auto;font-size:var(--fs-xs);font-weight:700;color:var(--good);flex:0 0 auto;margin-top:3px}

/* ── Blueprint ── */
.bp-wrap{min-height:calc(100vh - 56px);background-color:var(--surface-page);background-image:radial-gradient(var(--border-strong) 1px,transparent 1px);background-size:26px 26px;padding:44px 34px 90px}
.bp-actions{position:fixed;top:70px;right:24px;z-index:45;display:flex;gap:9px}
.bp-head{text-align:center;margin:0 auto 44px;max-width:760px}
.bp-head .eyebrow{font-size:var(--fs-s);font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.bp-head h1{font-family:var(--font-serif);font-size:44px;font-weight:400;letter-spacing:-.01em;margin:8px 0 4px}
.bp-head .sys{font-size:var(--fs-l);color:var(--ink-2)}
.bp-head .facts{display:flex;justify-content:center;gap:0;margin-top:26px;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--r-m);box-shadow:var(--sh-1);overflow:hidden;flex-wrap:wrap}
.bp-fact{padding:14px 26px;min-width:140px;border-right:1px solid var(--border);flex:1}
.bp-fact:last-child{border-right:0}
.bp-fact label{display:block;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.bp-fact b{font-size:var(--fs-xl);font-weight:700;font-variant-numeric:tabular-nums}
.bp-fact .sub{font-size:var(--fs-xs);color:var(--ink-3)}
.bp-lanes{max-width:1380px;margin:0 auto;display:flex;flex-direction:column}
.bp-inflow{display:flex;align-items:center;justify-content:center;gap:9px;padding:20px 0;color:var(--ink-3);font-size:var(--fs-s);font-style:italic}
.bp-inflow .ln{width:1px;height:22px;background:var(--border-strong)}
.bp-lane-title{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bp-lane-title .t{font-size:var(--fs-s);font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);white-space:nowrap}
.bp-lane-title .rule{flex:1;height:1px;background:var(--border-strong)}
.bp-lane-title .ct{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}
.bp-stages{display:flex;align-items:stretch;overflow-x:auto;padding:4px 2px 10px}
.bp-stage{flex:1 0 205px;min-width:205px;max-width:290px;background:var(--surface-card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh-2);padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.bp-stage .idx{font-size:var(--fs-xs);font-weight:700;color:var(--ink-3);letter-spacing:.05em}
.bp-stage .nm{font-size:var(--fs-body);font-weight:700;line-height:1.3}
.bp-stage .note{font-size:var(--fs-xs);color:var(--ink-3);line-height:1.45;font-style:italic}
.bp-autos{display:flex;flex-direction:column;gap:5px;margin-top:2px;padding-top:9px;border-top:1px dashed var(--border)}
.bp-auto{display:flex;align-items:center;gap:7px;font-size:var(--fs-s);color:var(--gold-ink);font-weight:600;line-height:1.3}
.bp-auto .tok{width:11px;height:11px;border-radius:50%;background:var(--gold-dot);border:1.5px solid var(--gold-ink);flex:0 0 auto}
.bp-conn{display:flex;align-items:center;flex:0 0 34px;position:relative}
.bp-conn::before{content:"";height:1.5px;background:var(--border-strong);flex:1}
.bp-conn::after{content:"";width:7px;height:7px;border-top:1.5px solid var(--border-strong);border-right:1.5px solid var(--border-strong);transform:rotate(45deg);margin-left:-7px}
.bp-legend{display:flex;justify-content:center;gap:26px;margin-top:40px;font-size:var(--fs-s);color:var(--ink-3);flex-wrap:wrap}
.bp-legend span{display:inline-flex;align-items:center;gap:7px}
.bp-legend .tok{width:11px;height:11px;border-radius:50%;background:var(--gold-dot);border:1.5px solid var(--gold-ink)}
.bp-legend .node{width:14px;height:11px;border-radius:3px;background:var(--surface-card);border:1px solid var(--border-strong)}
/* ── Report (print-ready document) ── */
.rpt-screen{background:var(--surface-page);min-height:calc(100vh - 56px);padding:28px 20px 90px}
.rpt-toolbar{max-width:840px;margin:0 auto 22px;display:flex;gap:10px;align-items:center}
.rpt-toolbar .spacer{margin-left:auto}
.rpt-toolbar .note{font-size:var(--fs-s);color:var(--ink-3)}
.rpt{max-width:840px;margin:0 auto;background:var(--surface-card);border:1px solid var(--border);box-shadow:var(--sh-2);border-radius:var(--r-m);overflow:hidden;color:var(--ink)}
.rpt-sec{padding:34px 54px}
.rpt-sec + .rpt-sec{border-top:1px solid var(--border)}
.rpt-h{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.rpt-h .no{font-size:var(--fs-s);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.rpt-h .tt{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.01em}
.rpt-h .rule{flex:1;height:1px;background:var(--border)}
.rpt-h .aside{font-size:var(--fs-s);color:var(--ink-3)}

/* cover */
.rpt-cover{padding:52px 54px 34px;background:var(--stump);color:var(--birch);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rpt-cover .mark{font-family:var(--font-serif);font-style:italic;font-size:24px;color:var(--birch)}
.rpt-cover .mark .accent{color:var(--rw-red)}
.rpt-cover .kicker{font-size:var(--fs-s);font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--deerskin);margin:34px 0 10px}
.rpt-cover h1{font-family:var(--font-serif);font-size:42px;font-weight:400;color:#fff;line-height:1.05;letter-spacing:-.01em}
.rpt-cover .sys{font-size:var(--fs-l);color:var(--birch);margin-top:8px}
.rpt-cover .meta{display:flex;flex-wrap:wrap;gap:26px 44px;margin-top:34px;padding-top:24px;border-top:1px solid rgba(228,224,213,.22)}
.rpt-cover .meta .m{min-width:120px}
.rpt-cover .meta label{display:block;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--deerskin);margin-bottom:3px}
.rpt-cover .meta .v{font-size:var(--fs-body);color:#fff}
.rpt-cover .meta .v.dim{color:var(--birch)}

/* facts */
.rpt-facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden}
.rpt-fact{padding:16px 20px;border-right:1px solid var(--border)}
.rpt-fact:last-child{border-right:0}
.rpt-fact label{display:block;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:4px}
.rpt-fact b{font-size:var(--fs-2xl);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rpt-fact .sub{font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px}
@media(max-width:640px){.rpt-facts{grid-template-columns:repeat(2,1fr)}.rpt-fact:nth-child(2){border-right:0}}

/* tables */
.rpt-tbl{width:100%;border-collapse:collapse;font-size:var(--fs-m)}
.rpt-tbl th{text-align:left;font-size:var(--fs-xs);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:6px 10px;border-bottom:1.5px solid var(--border-strong)}
.rpt-tbl th.num{text-align:right}
.rpt-tbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}

/* system architecture (vertical flow — never clipped) */

<script>
'use strict';

   module bindings so every render/picker reads the current library. */
let CATALOG = CATALOG_DEFAULT.map(a => ({ ...a, roles: a.roles.slice() }));
let CAT = Object.fromEntries(CATALOG.map(a => [a.id, a]));
function refreshCatalog() {
  CATALOG = (typeof S !== 'undefined' && S && S.catalog) ? S.catalog : CATALOG_DEFAULT;
  CAT = Object.fromEntries(CATALOG.map(a => [a.id, a]));
}
function autoUsage(id) {
  let n = 0;
  const scan = pkgs => pkgs.forEach(p => (p.pipelines || []).forEach(pl => pl.stages.forEach(st => (st.autos || []).forEach(a => { if (a.id === id) n++; }))));
  scan(S.packages);
  scan(S.clients.map(c => c.pkg).filter(Boolean));
  return n;
}

/* Custom prices Leads Inbox and Projects Board configuration as OPTIONAL add-ons (see
   "Configure Lead Inbox" / "Configure Projects Board" in its Configuration/Build milestone —
   both opt:true, inc:false there, unlike Advanced where they're included). The map must
   match that: Custom starts these two elements with no automations switched on, so the
   build/allowance/blueprint never shows them as already paid for. The pipeline shape stays
   as a starting scaffold the guide reshapes once the client actually buys that module. */
function zeroAutos(pipelines, kinds) {
  return pipelines.map(pl => kinds.includes(pl.kind)
    ? { ...pl, stages: pl.stages.map(st => ({ ...st, autos: (st.autos || []).map(a => ({ ...a, on: false })) })) }
    : pl);
}

      if (!S.catalog || S.catalogVer !== CATALOG_VER) {
        S.catalog = clone(CATALOG_DEFAULT); S.catalogVer = CATALOG_VER;
        // One-time: strip references to automations dropped in this library version
        // so existing client builds never show a raw id for a removed automation.
        const known = new Set(S.catalog.map(a => a.id));
        (S.clients || []).forEach(cl => (cl.pkg && cl.pkg.pipelines || []).forEach(pl =>
          pl.stages.forEach(st => { if (st.autos) st.autos = st.autos.filter(a => known.has(a.id)); })));
      }
      if (S.pkgVer !== PKG_VER) {
        S.packages = clone(DEFAULTS.packages); S.pkgVer = PKG_VER;
        // Stamp internal lines on existing client builds so their proposals hide them too.
        (S.clients || []).forEach(cl => (cl.pkg && cl.pkg.milestones || []).forEach(m =>
          m.tasks.forEach(t => { if (/client communication bucket/i.test(t.name)) t.cust = false; })));
      }
      if (!S.theme) S.theme = 'light';
      return; } }
  } catch (e) {}
  S = clone(DEFAULTS);
}

/* ════════ MATH — everything derives from here ════════ */
const isAddonRetLine = r => /custom add-ons/i.test(r.name || '');
function autosEnabled(p) {
  let n = 0;
  (p.pipelines || []).forEach(pl => pl.stages.forEach(st => (st.autos || []).forEach(a => { if (a.on) n++; })));
  return n;
}
function extraAutosOf(p) {
  if ((p.pipelines || []).length && !p.noAutos) {
    // Billed extra = the greater of what was quoted (extraManual, set outside the builder)
    // and what's actually built on the map. Building past the allowance is billed & flagged.
    const bought = Math.max(0, p.extraManual || 0);
    const built = Math.max(0, autosEnabled(p) - (p.autosIncluded || 0));
    return Math.max(bought, built);
  }
  return p.extraAutos || 0;
}
/* Total automation allowance quoted to the client = included + bought extra. */
function allowanceOf(p) { return (p.autosIncluded || 0) + Math.max(0, p.extraManual || 0); }
const extraOver = p => (p.pipelines || []).length && !p.noAutos && autosEnabled(p) > allowanceOf(p);
function creditsOf(p) { return extraAutosOf(p) + 1 * (p.integrations || 0) + (p.customForm ? 5 : 0); }
function addonRetHoursOf(p) {
  if (!(p.retainer || []).some(isAddonRetLine)) return 0;
  const credits = (p.autosIncluded || 0) + creditsOf(p);
  return (p.extInteg || 0) * 0.5 + (credits > 25 ? credits / 5 * 0.2 : 0);
}
function pkgCalc(p) {
  let billedHours = 0, optOffHours = 0;
  p.milestones.forEach(m => m.tasks.forEach(t => {
    if (!t.opt || t.inc) billedHours += +t.hours || 0; else optOffHours += +t.hours || 0;
  }));
  const setupBase = billedHours * S.rate;
  const enabled = autosEnabled(p);
  const extraAutos = extraAutosOf(p);
  const credits = creditsOf(p);
  const extIntegCost = (p.extInteg || 0) * 10 * S.rate;
  const addOns = credits * S.credit + extIntegCost;
  const addonRetHours = addonRetHoursOf(p);
  const retHours = (p.retainer || []).reduce((a, r) => a + (isAddonRetLine(r) ? 0 : +r.hours || 0), 0) + addonRetHours;
  return {
    billedHours, optOffHours, setupBase, enabled, extraAutos, credits, addOns, extIntegCost, addonRetHours,
    setupTotal: setupBase + addOns,
    monthly: retHours * S.rate, retHours,
  };
}
const tokensTotal = p => (p.autosIncluded || 0) + extraAutosOf(p);

/* Token-usage micro chart: gold within allotment, amber when over. */
function tokenDonut(used, total) {
  const over = used > total;
  const pct = total ? Math.min(1, used / total) : 0;
  const C = 2 * Math.PI * 8.5;
  return `<svg class="dz-donut" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">

  </svg>`;
}

/* Quiz scoring: sum answer weights, highest package wins (later = ties break upward). */
function quizRec(answers) {
  const score = { excel: 0, standard: 0, advanced: 0, custom: 0 };
  QUIZ.forEach(q => {
    const o = q.opts[answers[q.id]];
    if (o) Object.entries(o.w).forEach(([k, v]) => score[k] += v);
  });
  let best = 'standard', bestV = -1;
  ['excel', 'standard', 'advanced', 'custom'].forEach(k => { if (score[k] >= bestV) { best = k; bestV = score[k]; } });
  return best;
}
function quizWhy(answers, rec) {
  const bits = [];
  QUIZ.forEach(q => {
    const o = q.opts[answers[q.id]];
    if (o && o.w[rec]) bits.push(o.t.toLowerCase());
  });
  return bits.length ? 'Based on: ' + bits.slice(0, 3).join(' · ') : '';
}
function clientStatus(cl) {
  if (cl.finalized) return { t: 'Finalized', cls: 'good' };
  if (cl.pkg) return { t: 'In build', cls: 'gold' };
  if (cl.quiz && cl.quiz.done) return { t: 'Quiz done', cls: 'plain' };
  return { t: 'New', cls: 'plain' };
}

       ${c.monthly ? `<div class="per">then <b>${money(c.monthly)}/mo</b> support</div>` : '<div class="per">No monthly fees</div>'}
       ${copy.weeks ? `<div class="weeks">${copy.weeks}</div>` : ''}</div>`;
  const addonNote = c.addOns ? `<div class="addon-note">${money(c.setupBase)} base + ${money(c.addOns)} add-ons</div>` : '';
  return `<article class="pp-card ${isSel ? 'is-selected' : ''}">
    <div class="pp-flag ${isRec ? 'rec' : ''}">${isRec ? '★ Recommended' : copy.flag}</div>
    <div class="pp-card-body">
      <div><h2>${esc(p.name)}</h2><div class="pp-tag">${esc(copy.tag)}</div></div>
      ${priceBlock}
      <ul class="pp-bullets">${copy.bullets.map(b => `<li><span>${b}</span></li>`).join('')}</ul>
      ${p.id !== 'excel' ? autosPanel(p, c) : ''}
      ${milesPanel(p)}
    </div>
    <div class="pp-total">
      <div>
        <div class="setup">${isCustom ? 'From ' : ''}${money(c.setupTotal)}</div>
        <div class="mo">${c.monthly ? `then ${money(c.monthly)}${isCustom ? '+' : ''}/mo` : 'one-time, as-is'}</div>
        ${addonNote}
      </div>
      ${cl ? `<button class="pp-select ${isSel ? 'is-on' : ''}" data-act="plan-select" data-pkg="${p.id}" title="${isSel ? 'This is the selected plan — click to open the builder' : 'Set this as ' + esc(cl.name) + '’s plan'}">${isSel ? '✓ Selected' : 'Select this plan'}</button>` : ''}
    </div>
  </article>`;
}

function renderPlans() {
  SCOPE = 'tpl';
  const cl = activeClient();
  const rules = RULES.map(r => `<div class="pp-rule"><div class="t">${r.t}</div><div class="d">${r.d}</div></div>`).join('');
  const recNote = cl && cl.quiz && cl.quiz.done
    ? `Based on the quiz, <b>${esc(pkg(cl.quiz.rec).name)}</b> is the closest fit — but any plan can be picked here.`
    : 'Pick the plan together during the discovery meeting. Every price is computed from hours and add-ons.';
  return `<div class="page">
    <div class="intro">
      <h1>${cl ? `Plans for ${esc(cl.name)}` : 'Plans'}</h1>
      <p>${recNote}</p>
    </div>
    <div class="pp-grid">
      ${planCard(pkg('standard'), cl)}
      ${planCard(pkg('advanced'), cl)}
      ${planCard(pkg('custom'), cl)}
    </div>
    <div class="pp-more"><button class="link" data-act="open-excel">Working with a tighter budget? There’s one more option →</button></div>
    <details class="pp-rules"><summary>Ground rules ▾</summary><div class="grid">${rules}</div></details>
  </div>`;
}

/* ════════ BUILDER (system map) ════════ */
function laneStage(p, pi, si) {
  const st = p.pipelines[pi].stages[si];
  const chips = (st.autos || []).map((a, ai) => {
    const cat = CAT[a.id] || { n: a.id, d: '' };
    return `<button type="button" class="dz-chip ${a.on ? '' : 'off'}" data-act="chip-toggle" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" data-si="${si}" data-ai="${ai}"
      title="${esc(cat.d)} ${a.on ? '— on (uses 1 token). Click to switch off.' : '— off. Click to switch on (uses 1 token).'}">
      <span class="tok"></span><span class="nm">${esc(cat.n)}</span>
      <span class="x" data-act="chip-del" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" data-si="${si}" data-ai="${ai}" title="Remove from this stage">×</span>
    </button>`;
  }).join('');
  const addBtn = p.noAutos ? '' :
    `<button type="button" class="dz-add-auto" data-act="pop-open" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" data-si="${si}" title="Pick from the automation menu for this stage">+ automation</button>`;
  return `<div class="dz-stage">
    <div class="dz-stage-head">
      <input class="st-name" data-act="st-name" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" data-si="${si}" value="${esc(st.name)}" title="Click to rename this stage">
      <button type="button" class="st-del" data-act="st-del" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" data-si="${si}" title="Delete this stage">×</button>
    </div>
    <textarea class="st-note" rows="1" data-act="st-note" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" data-si="${si}" placeholder="Add a note…" title="Free-text note — appears on the final blueprint">${esc(st.note || '')}</textarea>
    <div class="dz-autos">${chips}</div>${addBtn}</div>`;
}

/* The Leads Inbox is a special element — a single flat list, not a stage pipeline. */
function inboxLane(p, pi) {
  const pl = p.pipelines[pi];
  const st = pl.stages[0] || { autos: [] };
  const si = 0;
  const onCount = (st.autos || []).filter(x => x.on).length;
  const chips = (st.autos || []).map((a, ai) => {
    const cat = CAT[a.id] || { n: a.id, d: '' };
    return `<button type="button" class="dz-chip ${a.on ? '' : 'off'}" data-act="chip-toggle" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" data-si="${si}" data-ai="${ai}"
      title="${esc(cat.d)} ${a.on ? '— on (uses 1 token). Click to switch off.' : '— off. Click to switch on (uses 1 token).'}">
      <span class="tok"></span><span class="nm">${esc(cat.n)}</span>
      <span class="x" data-act="chip-del" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" data-si="${si}" data-ai="${ai}" title="Remove">×</span>
    </button>`;
  }).join('');
  const addBtn = `<button type="button" class="dz-add-auto" data-act="pop-open" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" data-si="${si}" title="Add a lead automation">+ automation</button>`;
  const addon = p.id === 'custom';
  const addonBadge = addon ? `<span class="dz-addon-badge" title="Priced as an optional add-on for Custom — see “Configure Lead Inbox” in Package Settings">Optional add-on</span>` : '';
  const note = addon
    ? 'Leads sit here as a single list — no stages. Optional for Custom: this element is quoted separately and starts with nothing switched on until the client buys it.'
    : 'Leads sit here as a single list — no stages. These automations assign, tag, and convert them into deals.';
  return `<div class="dz-inflow"><span class="ar">${pi === 0 ? '⇢' : '⤷'}</span>
      <input data-act="pl-inflow" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" value="${esc(pl.inflow || '')}" placeholder="Describe how leads arrive…"></div>
    <div class="dz-lane dz-inbox">
      <div class="dz-lane-head">
        <span class="dz-inbox-badge">List</span>
        <input class="pl-name" data-act="pl-name" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" value="${esc(pl.name)}" title="Rename">
        ${addonBadge}
        <span class="meta">${onCount} lead automation${onCount === 1 ? '' : 's'} on</span>
        <button type="button" class="pl-del" data-act="pl-del" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" title="Delete this element">×</button>
      </div>
      <div class="dz-inbox-note">${note}</div>
      <div class="dz-inbox-chips">${chips}${addBtn}</div>
    </div>`;
}

function lanesHTML(p) {
  return (p.pipelines || []).map((pl, pi) => {
    if (pl.kind === 'inbox') return inboxLane(p, pi);
    const onCount = pl.stages.reduce((a, st) => a + (st.autos || []).filter(x => x.on).length, 0);
    const stages = pl.stages.map((st, si) => laneStage(p, pi, si)).join('<div class="dz-arrow" aria-hidden="true">→</div>');
    const meta = `${pl.stages.length} stages${p.noAutos ? '' : ` · ${onCount} automation${onCount === 1 ? '' : 's'} on`}`;
    const addonBadge = (pl.kind === 'projects' && p.id === 'custom')
      ? `<span class="dz-addon-badge" title="Priced as an optional add-on for Custom — see “Configure Projects Board” in Package Settings. Starts with nothing switched on until the client buys it.">Optional add-on</span>` : '';
    return `<div class="dz-inflow"><span class="ar">${pi === 0 ? '⇢' : '⤷'}</span>
        <input data-act="pl-inflow" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" value="${esc(pl.inflow || '')}" placeholder="Describe how deals arrive in this pipeline…" title="Shown as the connector label on the blueprint"></div>
      <div class="dz-lane">
      <div class="dz-lane-head">
        <input class="pl-name" data-act="pl-name" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" value="${esc(pl.name)}" title="Click to rename this pipeline">
        ${addonBadge}
        <span class="meta">${meta}</span>
        <button type="button" class="pl-del" data-act="pl-del" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" title="Delete this pipeline">×</button>
      </div>
      <div class="dz-stages">${stages}<div class="dz-arrow" aria-hidden="true">→</div>
        <button type="button" class="dz-stage-add" data-act="st-add" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${pi}" title="Add a stage to this pipeline">+</button>
      </div>
    </div>`;
  }).join('');
}

function autoPickerModal(p) {
  if (!addPop) return '';
  const pl = p.pipelines[addPop.pi]; if (!pl) { addPop = null; return ''; }
  const st = pl.stages[addPop.si]; if (!st) { addPop = null; return ''; }
  const have = new Set((st.autos || []).map(a => a.id));
  const rec = st.role ? CATALOG.filter(a => a.roles.includes(st.role)) : [];
  const rest = CATALOG.filter(a => !rec.includes(a));
  const item = a => `<button type="button" class="it ${have.has(a.id) ? 'added' : ''}" ${have.has(a.id) ? '' : `data-act="pop-add" data-scope="${SCOPE}" data-pkg="${p.id}" data-pi="${addPop.pi}" data-si="${addPop.si}" data-cid="${a.id}"`}>
    <span class="tok"></span><span><span class="nm">${esc(a.n)}</span><span class="d">${esc(a.d)}</span></span>
    ${have.has(a.id) ? '<span class="got">added ✓</span>' : ''}
  </button>`;
  return `<div class="dz-scrim" data-act="pop-close"></div>
  <div class="dz-modal" role="dialog" aria-label="Add automation">
    <div class="hd2"><span class="t">Add automation — ${esc(st.name)}</span>
      <button type="button" class="close" data-act="pop-close" aria-label="Close">×</button></div>
    <div class="bd">
      ${rec.length ? `<div class="grp">Suggested for this stage</div>${rec.map(item).join('')}<div class="grp">Everything else</div>` : `<div class="grp">All automations</div>`}
      ${rest.map(item).join('')}
    </div>
  </div>`;
}

function renderBuilder() {
  const cl = activeClient();
  const p = cl.pkg;
  SCOPE = 'client';
  const c = pkgCalc(p);
  const copy = COPY[p.id] || {};
  const allow = allowanceOf(p);
  const bought = Math.max(0, p.extraManual || 0);
  const over = c.enabled > allow;
  const overN = c.enabled - allow;
  const stats = p.noAutos
    ? `<span class="dz-stat">${esc(copy.mapNote || '')}</span>`
    : `<span class="dz-stat" title="Automations switched on across the map, against this client’s allowance (${p.autosIncluded} included${bought ? ` + ${bought} extra` : ''})">${tokenDonut(c.enabled, allow)}<b>${c.enabled}</b> of <b>${allow}</b> automations</span>
       <span class="dz-stat ${over ? 'over' : ''}" title="${over ? 'Building past the allowance is allowed — it’s flagged and billed at ' + money(S.credit) + ' each' : 'Within the quoted allowance'}">
         ${over ? `${ICONS.warn} <b>${overN}</b> over allowance · +${money(overN * S.credit)}` : (bought ? `<b>${bought}</b> extra quoted` : 'within allowance')}</span>`;
  const inclPanel = !INCL_OPEN ? '' : `<div class="dz-incl">
    <div><span class="sec-label" style="display:block;margin-bottom:8px">${esc(p.name)} plan — what’s included</span>
      <ul class="pp-bullets">${(copy.bullets || []).map(b => `<li><span>${b}</span></li>`).join('')}</ul></div>
    <div><span class="sec-label" style="display:block;margin-bottom:8px">Add-ons</span>${autosPanel(p, c)}</div>
  </div>`;
  const html = `<div class="page wide">
    <div class="dz-bar">
      ${stats}
      <span class="money">${money(c.setupTotal)} <span class="mo">setup${c.monthly ? ` · ${money(c.monthly)}/mo` : ''}</span></span>
      <span class="right">
        <button class="btn btn-ghost btn-sm ${INCL_OPEN ? '' : ''}" data-act="incl-toggle" title="Plan features and add-ons">${INCL_OPEN ? 'Hide' : 'What’s included'} ${INCL_OPEN ? '▴' : '▾'}</button>
        <button class="btn btn-secondary btn-sm" data-act="goto-plans" title="Compare or swap the selected plan">Change plan</button>
        <button class="btn btn-primary btn-sm" data-act="finalize" title="Lock the map and open the presentation blueprint">Finalize build ▸</button>
      </span>
    </div>
    ${inclPanel}
    ${(p.noAutos || (S.hints || {}).builder) ? '' : `<div class="hint-callout">
      <span><b>First time in the builder?</b> Click any text to rename it. Gold chips are automations that are on — click one to switch it off; dashed chips are available but unbuilt. Building past this client’s allowance is allowed — it’s flagged and billed at ${money(S.credit)} each. Set the extra allowance from the client menu (top-right).</span>
      <button class="ok" data-act="hint-dismiss" data-k="builder">Got it</button>
    </div>`}
    ${lanesHTML(p)}
    <button type="button" class="dz-pl-add" data-act="pl-add" data-scope="client" data-pkg="${p.id}">+ Add pipeline</button>
    ${autoPickerModal(p)}
  </div>`;
  SCOPE = 'tpl';
  return html;
}

/* ════════ BLUEPRINT ════════ */
function renderBlueprint() {
  const cl = activeClient();
  const p = cl.pkg;
  const c = pkgCalc(p);
  const copy = COPY[p.id] || {};
  const lanes = (p.pipelines || []).map((pl, pi) => {
    const onCount = pl.stages.reduce((a, st) => a + (st.autos || []).filter(x => x.on).length, 0);
    const stages = pl.stages.map((st, si) => {
      const autos = (st.autos || []).filter(a => a.on)
        .map(a => `<div class="bp-auto" title="${esc((CAT[a.id] || {}).d || '')}"><span class="tok"></span>${esc((CAT[a.id] || { n: a.id }).n)}</div>`).join('');
      return `<div class="bp-stage">
        <span class="idx">${String(si + 1).padStart(2, '0')}</span>
        <span class="nm">${esc(st.name)}</span>
        ${st.note ? `<span class="note">${esc(st.note)}</span>` : ''}
        ${autos ? `<div class="bp-autos">${autos}</div>` : ''}
      </div>`;
    }).join('<div class="bp-conn" aria-hidden="true"></div>');
    return `${pl.inflow ? `<div class="bp-inflow"><span class="ln"></span>${esc(pl.inflow)}</div>` : '<div style="height:20px"></div>'}
      <div>
        <div class="bp-lane-title"><span class="t">${esc(pl.name)}</span><span class="rule"></span>
          <span class="ct">${pl.kind === 'inbox' ? 'List' : pl.stages.length + ' stages'}${onCount ? ` · ${onCount} automations` : ''}</span></div>
        <div class="bp-stages">${stages}</div>
      </div>`;
  }).join('');
  return `<div class="bp-wrap">
    <div class="bp-actions">
      <button class="btn btn-secondary btn-sm" data-act="goto-builder" title="Reopen the editable builder">${ICONS.pencil} Edit build</button>
      <button class="btn btn-primary btn-sm" data-act="goto-report" title="Open the full print-ready proposal report">${ICONS.printer} Full report</button>
    </div>
    <div class="bp-head">
      <div class="eyebrow">System blueprint · prepared ${fmtDate(today())}</div>
      <h1>${esc(cl.name)}</h1>
      <div class="sys">${esc(p.name)} Sales &amp; Marketing System</div>
      <div class="facts">
        <div class="bp-fact"><label>Setup</label><b>${money(c.setupTotal)}</b>${c.addOns ? `<div class="sub">${money(c.setupBase)} base + ${money(c.addOns)} add-ons</div>` : ''}</div>
        <div class="bp-fact"><label>Monthly support</label><b>${c.monthly ? money(c.monthly) : '—'}</b><div class="sub">${c.monthly ? 'starts 30 days after launch' : 'delivered as-is'}</div></div>
        <div class="bp-fact"><label>Automations</label><b>${c.enabled}</b><div class="sub">${p.noAutos ? 'built into the workbook' : 'of ' + tokensTotal(p) + ' available'}</div></div>
        <div class="bp-fact"><label>Timeline</label><b>${copy.weeksShort}</b><div class="sub">kickoff to launch</div></div>
      </div>
    </div>
    <div class="bp-lanes">${lanes}</div>
    <div class="bp-legend">
      <span><span class="node"></span> pipeline stage</span>
      <span><span class="tok"></span> automated step — runs without anyone remembering it</span>
    </div>
  </div>`;
}

/* ════════ REPORT (print-ready proposal document) ════════ */
function renderReport() {
  const cl = activeClient();
  const p = cl.pkg;
  const c = pkgCalc(p);
  const copy = COPY[p.id] || {};
  const tt = tokensTotal(p);

  /* Which optional sections exist — needed before numbering */
  const addonLines = [];
  if (c.extraAutos) addonLines.push([`Extra automations <span class="tag">beyond the ${p.autosIncluded} included</span>`, `${c.extraAutos} × ${money(S.credit)}`, c.extraAutos * S.credit]);
  if (p.integrations) addonLines.push(['App connections', `${p.integrations} × ${money(1 * S.credit)}`, p.integrations * 1 * S.credit]);
  if (p.extInteg) addonLines.push(['External integrations', `${p.extInteg} × ${money(10 * S.rate)}`, p.extInteg * 10 * S.rate]);
  if (p.customForm) addonLines.push(['Custom web-form connection', money(5 * S.credit), 5 * S.credit]);
  const hasRet = (p.retainer || []).length > 0;
  const activeIds = [];
  (p.pipelines || []).forEach(pl => pl.stages.forEach(st => (st.autos || []).forEach(a => { if (a.on && !activeIds.includes(a.id)) activeIds.push(a.id); })));

  /* Sequential section numbers, computed once in document order */
  let seqN = 0;
  const NO = () => String(++seqN).padStart(2, '0');
  const investNo = NO();
  const scopeNo = NO();
  const addonNo = addonLines.length ? NO() : null;
  const retNo = hasRet ? NO() : null;
  const archNo = NO();
  const refNo = activeIds.length ? NO() : null;
  const termsNo = NO();

  /* Cover meta */
  const metaItems = [
    ['Prepared for', esc(cl.name), false],
    cl.contact ? ['Contact', esc(cl.contact), false] : null,
    (cl.email || cl.phone) ? ['Reach', esc([cl.email, cl.phone].filter(Boolean).join('  ·  ')), true] : null,
    ['Date', fmtDate(today()), true],
    ['Plan', esc(p.name), false],
  ].filter(Boolean);
  const meta = metaItems.map(([l, v, dim]) =>
    `<div class="m"><label>${l}</label><div class="v ${dim ? 'dim' : ''}">${v}</div></div>`).join('');

  /* Scope of work — client-facing: internal & not-included lines hidden, friendly labels,
     no per-milestone pricing (only the final setup total shows). */
  const scope = p.milestones.map(m => {
    const label = m.name.replace(/^Milestone \d+:\s*/, '');
    const rows = m.tasks.filter(isClientTask).map(t =>
      `<tr><td>${esc(clientLabel(t))}</td></tr>`).join('');
    if (!rows) return '';
    return `<tbody><tr class="mrow"><td>${esc(label)}</td></tr>${rows}</tbody>`;
  }).join('');

  const addonsSec = addonLines.length ? `
    <section class="rpt-sec"><div class="rpt-h"><span class="no">${addonNo}</span><span class="tt">Add-ons &amp; credits</span><span class="rule"></span></div>
      <table class="rpt-tbl"><thead><tr><th>Item</th><th class="num">Detail</th><th class="num">Amount</th></tr></thead>
        <tbody>${addonLines.map(([nm, d, amt]) => `<tr><td>${nm}</td><td class="num">${d}</td><td class="num">${money(amt)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Add-ons total</td><td></td><td class="num">${money(c.addOns)}</td></tr></tfoot>
      </table>
      <div class="rpt-note">Credit values: one credit per extra automation (${money(S.credit)}), one per app connection, and five for a custom web-form plugin${p.id === 'custom' ? `. External software integrations are quoted at ${money(10 * S.rate)} each` : ''}.</div>
    </section>` : '';

  const retSec = hasRet ? (() => {
    const rows = p.retainer.map(r => {
      if (isAddonRetLine(r)) return `<tr><td>${esc(r.name)} <span class="tag">scales with add-ons</span></td><td class="num">${money(c.addonRetHours * S.rate)}</td></tr>`;
      const h = +r.hours || 0;
      return `<tr><td>${esc(r.name)}</td><td class="num">${money(h * S.rate)}</td></tr>`;
    }).join('');
    return `<section class="rpt-sec"><div class="rpt-h"><span class="no">${retNo}</span><span class="tt">Monthly support retainer</span><span class="rule"></span><span class="aside">begins 30 days after launch</span></div>
      <table class="rpt-tbl"><thead><tr><th>Line item</th><th class="num">Per month</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>Monthly total</td><td class="num">${money(c.monthly)}</td></tr></tfoot>
      </table></section>`;
  })() : '';

  /* System architecture — vertical, paginate-safe */
  const flow = (p.pipelines || []).map(pl => {
    const onCount = pl.stages.reduce((a, st) => a + (st.autos || []).filter(x => x.on).length, 0);
    const stages = pl.stages.map((st, si) => {
      const autos = (st.autos || []).filter(a => a.on).map(a => {
        const cat = CAT[a.id] || { n: a.id, d: '' };
        return `<li><b>${esc(cat.n)}</b>${cat.d ? ` — ${esc(cat.d)}` : ''}</li>`;
      }).join('');
      return `<div class="rpt-stage">
        <div class="rpt-stage-h"><span class="rpt-stage-idx">${String(si + 1).padStart(2, '0')}</span><span class="rpt-stage-nm">${esc(st.name)}</span></div>
        ${st.note ? `<div class="rpt-stage-note">${esc(st.note)}</div>` : ''}
        ${autos ? `<ul class="rpt-stage-autos">${autos}</ul>` : `<div class="rpt-stage-empty">${p.noAutos ? 'Handled manually in the workbook.' : 'No automated steps on this stage.'}</div>`}
      </div>`;
    }).join('<div class="rpt-flow-conn" aria-hidden="true"></div>');
    return `<div class="rpt-pipe">
      <div class="rpt-pipe-h"><span class="rpt-pipe-nm">${esc(pl.name)}</span><span class="rpt-pipe-meta">${pl.kind === 'inbox' ? 'List' : pl.stages.length + ' stages'}${p.noAutos ? '' : ` · ${onCount} automations`}</span></div>
      ${pl.inflow ? `<div class="rpt-pipe-inflow">${esc(pl.inflow)}</div>` : ''}
      <div class="rpt-flow">${stages}</div>
    </div>`;
  }).join('');

  const glossSec = activeIds.length ? `

        <div class="meta">${meta}</div>
      </div>

      <section class="rpt-sec"><div class="rpt-h"><span class="no">${investNo}</span><span class="tt">Investment summary</span><span class="rule"></span></div>
        <div class="rpt-facts">
          <div class="rpt-fact"><label>Setup</label><b>${money(c.setupTotal)}</b>${c.addOns ? `<div class="sub">${money(c.setupBase)} base + ${money(c.addOns)} add-ons</div>` : '<div class="sub">one-time</div>'}</div>
          <div class="rpt-fact"><label>Monthly</label><b>${c.monthly ? money(c.monthly) : 'None'}</b><div class="sub">${c.monthly ? 'support & maintenance' : 'delivered as-is'}</div></div>
          <div class="rpt-fact"><label>Automations</label><b>${c.enabled}</b><div class="sub">${p.noAutos ? 'built into workbook' : 'of ' + tt + ' available'}</div></div>

        <div class="rpt-note">${esc(copy.tag || '')} This proposal covers the ${esc(p.name)} package as configured in the build below${c.optOffHours ? '. Optional modules currently switched off are listed but not included in the totals' : ''}.</div>

      <section class="rpt-sec"><div class="rpt-h"><span class="no">${scopeNo}</span><span class="tt">Scope of work</span><span class="rule"></span></div>

function editTable(p, embedded) {
  const c = pkgCalc(p);
  let rows = '';
  p.milestones.forEach((m, mi) => {
    rows += `<tr class="mile-row">
      <td colspan="2"><input class="t-name m-input" data-act="mile-name" data-pkg="${p.id}" data-scope="${SCOPE}" data-mi="${mi}" value="${esc(m.name)}"></td>
      <td class="num"></td><td></td>
      <td class="num"><button class="del" data-act="mile-del" data-pkg="${p.id}" data-scope="${SCOPE}" data-mi="${mi}" title="Delete milestone and its tasks">×</button></td>
    </tr>`;
    m.tasks.forEach((t, ti) => {
      const off = t.opt && !t.inc;
      const line = (!t.opt || t.inc) ? (+t.hours || 0) * S.rate : 0;
      const hidden = t.cust === false;
      rows += `<tr class="${off ? 'opt-off' : ''} ${hidden ? 'cust-off' : ''}">
        <td><input class="t-name" data-act="task-name" data-pkg="${p.id}" data-scope="${SCOPE}" data-mi="${mi}" data-ti="${ti}" value="${esc(t.name)}" title="Internal task name (your tracking)">
          <input class="t-clabel" data-act="task-clabel" data-pkg="${p.id}" data-scope="${SCOPE}" data-mi="${mi}" data-ti="${ti}" value="${esc(t.clabel || '')}" placeholder="${hidden ? 'hidden from client' : esc(clientLabel({ name: t.name }))}" title="Client-facing label shown on the proposal (leave blank to use the default)" ${hidden ? 'disabled' : ''}></td>
        <td class="num"><input class="t-hrs" type="number" min="0" step="0.5" data-act="task-hrs" data-pkg="${p.id}" data-scope="${SCOPE}" data-mi="${mi}" data-ti="${ti}" value="${t.hours}"></td>
        <td class="num">${money(line, true)}</td>
        <td class="opt-cell">
          <label title="Show this line on the client proposal"><input type="checkbox" data-act="task-cust" data-pkg="${p.id}" data-scope="${SCOPE}" data-mi="${mi}" data-ti="${ti}" ${hidden ? '' : 'checked'}> client</label>
          <label style="margin-left:8px" title="Optional module — can be switched on or off per client"><input type="checkbox" data-act="task-opt" data-pkg="${p.id}" data-scope="${SCOPE}" data-mi="${mi}" data-ti="${ti}" ${t.opt ? 'checked' : ''}> optional</label>
          ${t.opt ? `<label style="margin-left:8px" title="Included in the price right now?"><input type="checkbox" data-act="task-inc" data-pkg="${p.id}" data-scope="${SCOPE}" data-mi="${mi}" data-ti="${ti}" ${t.inc ? 'checked' : ''}> included</label>` : ''}
        </td>
        <td class="num"><button class="del" data-act="task-del" data-pkg="${p.id}" data-scope="${SCOPE}" data-mi="${mi}" data-ti="${ti}" title="Delete line">×</button></td>
      </tr>`;
    });
    rows += `<tr><td colspan="5" style="border-bottom:0;padding-top:2px">
      <button class="pp-add-row" data-act="task-add" data-pkg="${p.id}" data-scope="${SCOPE}" data-mi="${mi}">+ Add line</button>
    </td></tr>`;
  });
  let retRows = '';
  (p.retainer || []).forEach((r, ri) => {
    if (isAddonRetLine(r)) {
      retRows += `<tr>
        <td>${esc(r.name)}<span class="pp-auto-chip" title="Hours computed from this package’s add-ons">auto</span></td>
        <td class="num">${fmtHrs(c.addonRetHours)}</td>
        <td class="num">${money(c.addonRetHours * S.rate, true)}</td><td></td>
        <td class="num"><button class="del" data-act="ret-del" data-pkg="${p.id}" data-scope="${SCOPE}" data-ri="${ri}" title="Delete line">×</button></td>
      </tr>`;
      return;
    }
    retRows += `<tr>
      <td><input class="t-name" data-act="ret-name" data-pkg="${p.id}" data-scope="${SCOPE}" data-ri="${ri}" value="${esc(r.name)}"></td>
      <td class="num"><input class="t-hrs" type="number" min="0" step="0.5" data-act="ret-hrs" data-pkg="${p.id}" data-scope="${SCOPE}" data-ri="${ri}" value="${r.hours}"></td>
      <td class="num">${money((+r.hours || 0) * S.rate, true)}</td><td></td>
      <td class="num"><button class="del" data-act="ret-del" data-pkg="${p.id}" data-scope="${SCOPE}" data-ri="${ri}" title="Delete line">×</button></td>
    </tr>`;
  });
  const hasAddonRet = (p.retainer || []).some(isAddonRetLine);
  const optNote = c.optOffHours ? ` <span class="sub">(+${fmtHrs(c.optOffHours)} hrs optional, off)</span>` : '';
  return `<section class="${embedded ? 'pp-edit-embed' : 'pp-edit-card'}">
    <div class="pp-edit-head">
      ${embedded ? '' : `<h2>${esc(p.name)}</h2>`}
      <span class="sub">${fmtHrs(c.billedHours)} billed hrs${optNote}</span>
      <button type="button" class="btn btn-secondary btn-sm" data-act="design-open" data-scope="${SCOPE}" data-pkg="${p.id}" title="Edit this template’s pipelines, stages, and automations">System map ▸</button>
      <span class="tot">Setup ${money(c.setupTotal, true)}${c.monthly ? ` · ${money(c.monthly, true)}/mo` : ''}</span>
    </div>
    <div class="pp-edit-body">
      <table class="pp-tbl">
        <thead><tr><th>Task item</th><th class="num">Hours</th><th class="num">Line total</th><th>Module</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td>Setup total</td>
          <td class="num">${fmtHrs(c.billedHours)}</td>
          <td class="num">${money(c.setupBase, true)}</td>
          <td colspan="2">${c.addOns ? `+ ${money(c.addOns, true)} add-ons = <b>${money(c.setupTotal, true)}</b>` : ''}</td>
        </tr></tfoot>
      </table>
      <button class="pp-add-row" data-act="mile-add" data-pkg="${p.id}" data-scope="${SCOPE}">+ Add milestone</button>
      ${p.id !== 'excel' ? `
      <div class="pp-ret-title">Monthly retainer</div>
      <table class="pp-tbl">
        <thead><tr><th>Line</th><th class="num">Hours / mo</th><th class="num">Line total</th><th></th><th></th></tr></thead>
        <tbody>${retRows}</tbody>
        <tfoot><tr><td>Monthly total</td><td class="num">${fmtHrs(c.retHours)}</td><td class="num">${money(c.monthly, true)}</td><td colspan="2"></td></tr></tfoot>
      </table>
      ${hasAddonRet ? `<div class="pp-formula-note">Custom Add-Ons hours = external integrations × 0.5 + (credits ÷ 5 × 0.2 when credits &gt; 25). Credits = ${p.autosIncluded} base + 1 per extra automation + 1 per app connection + 5 for a custom web form.</div>` : ''}
      <button class="pp-add-row" data-act="ret-add" data-pkg="${p.id}" data-scope="${SCOPE}">+ Add retainer line</button>` : ''}
    </div>
  </section>`;
}

function tplRow(p) {
  const isOpen = TPL.open === p.id;
  const c = pkgCalc(p);
  const summary = isOpen ? '' : `<span class="tpl-sum">
      <span>${money(c.setupTotal)}<em>setup</em></span>
      <span>${c.monthly ? money(c.monthly) + '<em>/mo</em>' : '<em>no monthly</em>'}</span>
      <span>${p.milestones.length}<em>milestones</em></span>
      ${p.noAutos ? '<span><em>workbook automation</em></span>' : `<span>${p.autosIncluded}<em>automations incl.</em></span>`}
    </span>`;
  return `<div class="tpl-item ${isOpen ? 'is-open' : ''}">
    <button type="button" class="tpl-hd" data-act="tpl-toggle" data-pkg="${p.id}" title="${isOpen ? 'Collapse' : 'Expand to edit milestones, tasks, and pricing'}">
      <span class="tpl-nm">${esc(p.name)}</span>
      ${summary}
      <span class="tpl-chev">${isOpen ? '▴' : '▾'}</span>
    </button>
    ${isOpen ? `<div class="tpl-body">${editTable(p, true)}</div>` : ''}
  </div>`;
}

function libItem(a) {
  const open = TPL.editAuto === a.id;
  if (!open) {
    const tags = (a.roles || []).map(r => `<span class="chip neutral">${esc(ROLES[r] || r)}</span>`).join('');
    return `<button type="button" class="lib-item" data-act="auto-edit" data-cid="${a.id}" title="Edit this automation">
      <span class="lib-tok"></span>
      <span class="lib-item-main"><span class="lib-nm">${esc(a.n)}</span><span class="lib-d">${esc(a.d) || '<em>No description yet</em>'}</span></span>
      <span class="lib-tags">${tags}</span>
      <span class="lib-chev">✎</span>
    </button>`;
  }
  const uses = autoUsage(a.id);
  const roleChips = Object.entries(ROLES).map(([k, v]) =>
    `<button type="button" class="lib-role ${(a.roles || []).includes(k) ? 'on' : ''}" data-act="auto-role" data-cid="${a.id}" data-role="${k}">${esc(v)}</button>`).join('');
  return `<div class="lib-item-edit">
    <div class="fld"><label>Name</label><input class="in" data-act="auto-name" data-cid="${a.id}" value="${esc(a.n)}" placeholder="Automation name"></div>
    <div class="fld"><label>What it does</label><textarea class="in" rows="2" data-act="auto-desc" data-cid="${a.id}" placeholder="Plain-English description — shows in the picker and the client report">${esc(a.d)}</textarea></div>
    <div class="fld"><label>Suggested for stage types <span class="lib-hint">appears under “suggested” in the stage picker</span></label>
      <div class="lib-roles">${roleChips}</div></div>
    <div class="lib-edit-foot">
      <span class="lib-hint">${uses ? `In use in ${uses} place${uses === 1 ? '' : 's'}` : 'Not used in any build yet'}</span>
      <span style="margin-left:auto"></span>
      <button type="button" class="btn btn-ghost danger btn-sm" data-act="auto-del" data-cid="${a.id}">Delete</button>
      <button type="button" class="btn btn-secondary btn-sm" data-act="auto-edit" data-cid="${a.id}">Done</button>
    </div>
  </div>`;
}

function libraryBody() {
  const groups = {};
  S.catalog.forEach(a => { const k = (a.roles && a.roles[0]) || '_other'; (groups[k] = groups[k] || []).push(a); });
  const order = [...Object.keys(ROLES), '_other'];
  const body = order.filter(k => groups[k]).map(k => {
    const label = k === '_other' ? 'Unassigned' : ROLES[k];
    return `<div class="lib-group"><div class="lib-group-h">${esc(label)}</div>${groups[k].map(libItem).join('')}</div>`;
  }).join('');
  return `<div class="lib-body">
    <div class="lib-top">
      <span class="lib-hint">Automations you can attach to any stage. Renaming or re-describing one updates it everywhere it’s used.</span>
      <button type="button" class="btn btn-secondary btn-sm" data-act="auto-add">+ Add automation</button>
    </div>
    ${body || '<div class="lib-empty">No automations yet — add one to get started.</div>'}
  </div>`;
}

        <span class="tpl-nm">Automation library</span>

        <span class="tpl-chev">${TPL.showLib ? '▴' : '▾'}</span>

let DRAWER = null; // 'client' | 'excel'

    return `<div class="cd-quiz-row">

  $('#drawerTitle').textContent = 'Client details';
  $('#drawerBody').innerHTML = `
    <div class="grp"><span class="sec-label">Info</span>
      <div class="fields">
        <div class="fld"><label>Client / business name</label><input class="in" data-act="cd-name" value="${esc(cl.name)}"></div>
        <div class="fld"><label>Contact person</label><input class="in" data-act="cd-contact" value="${esc(cl.contact || '')}" placeholder="—"></div>
        <div class="fld"><label>Email</label><input class="in" data-act="cd-email" type="email" value="${esc(cl.email || '')}" placeholder="—"></div>

        return `<div class="cd-extra">
          <div class="cd-extra-top"><span class="lbl">Extra automations</span>
            <span class="pp-qty">
              <button type="button" data-act="extra-step" data-scope="client" data-pkg="${p.id}" data-d="-1" aria-label="Fewer">−</button>
              <input type="number" min="0" step="1" inputmode="numeric" data-act="extra-set" data-scope="client" data-pkg="${p.id}" value="${bought}" aria-label="Extra automations quoted">
              <button type="button" data-act="extra-step" data-scope="client" data-pkg="${p.id}" data-d="1" aria-label="More">+</button>
            </span></div>
          <div class="cd-extra-note">${p.autosIncluded} included + ${bought} extra = <b>${allow}</b> allowance${over ? ` · <span style="color:var(--warn);font-weight:600">${en - allow} built over</span>` : ''} · +${money(extraAutosOf(p) * S.credit)}</div>
