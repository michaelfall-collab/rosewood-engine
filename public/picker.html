function renderExcelDrawer() {
  SCOPE = 'tpl';
  $('#drawerTitle').textContent = 'One more option';
  $('#drawerBody').innerHTML = planCard(pkg('excel'), activeClient());
  $('#drawerFoot').style.display = 'none';
}
function openDrawer(kind) {
  DRAWER = kind;
  if (kind === 'client') renderClientDrawer(activeClient());
  else renderExcelDrawer();
  $('#drawer').classList.add('is-open'); $('#backdrop').classList.add('is-open');
}
function closeDrawer() {
  DRAWER = null;
  $('#drawer').classList.remove('is-open'); $('#backdrop').classList.remove('is-open');
}

/* ════════ CHROME (header) ════════ */
function setChrome() {
  const cl = activeClient();
  let crumb = '';
  if (S.screen === 'intake') crumb = '<b>New project</b>';
  else if (S.screen === 'templates') crumb = '<b>Package settings</b>';
  else if (S.screen === 'design' && S.designCtx) crumb = `Package settings <span class="sep">›</span> <b>${esc(pkg(S.designCtx.pkgId).name)} map</b>`;
  else if (cl) {
    const leaf = { plans: 'Plans', builder: 'Builder', blueprint: 'Blueprint', report: 'Report' }[S.screen] || '';
    crumb = `${esc(cl.name)}${leaf ? ` <span class="sep">›</span> <b>${leaf}</b>` : ''}`;
  }
  $('#crumb').innerHTML = crumb;
  const showChip = cl && ['plans', 'builder', 'blueprint', 'report', 'intake'].includes(S.screen);
  $('#hdActions').innerHTML = showChip
    ? `<button class="hd-client" data-act="open-client-drawer" title="Client details — info, quiz answers, and plan. Exit the client from here.">
        <span class="av">${esc(initials(cl.name))}</span>${esc(cl.name)}
        ${cl.pkg ? `<span class="pl">${esc(cl.pkg.name)}</span>` : ''}<span class="chev">▾</span>
      </button>`
    : '';
}

/* ════════ RENDER ════════ */
function applyTheme() {
  const t = S.theme || 'light';
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('is-active', b.dataset.theme === t));
}
function render() {
  refreshCatalog();
  applyTheme();
  const openMiles = new Set();
  document.querySelectorAll('.pp-miles[open]').forEach(d => {
    const card = d.closest('.pp-card, .pp-edit-card, .dz-incl');
    if (card) openMiles.add(card.querySelector('h2')?.textContent || 'panel');
  });
  const rulesOpen = !!document.querySelector('.pp-rules[open]');
  let html;
  switch (S.screen) {
    case 'intake':    html = activeClient() || QZ.step === 0 ? renderIntake() : renderHome(); break;
    case 'plans':     html = activeClient() ? renderPlans() : renderHome(); break;
    case 'builder':   html = activeClient()?.pkg ? renderBuilder() : renderHome(); break;
    case 'blueprint': html = activeClient()?.pkg ? renderBlueprint() : renderHome(); break;
    case 'report':    html = activeClient()?.pkg ? renderReport() : renderHome(); break;
    case 'templates': html = renderTemplates(); break;
    case 'design':    html = S.designCtx ? renderDesign() : renderTemplates(); break;
    default:          S.screen = 'home'; html = renderHome();
  }
  $('#page').innerHTML = html;
  $('#page').classList.toggle('anim', LAST_SCREEN !== S.screen);
  LAST_SCREEN = S.screen;
  setChrome();
  document.querySelectorAll('.pp-card, .pp-edit-card, .dz-incl').forEach(card => {
    const name = card.querySelector('h2')?.textContent || '';
    if (openMiles.has(name)) card.querySelector('.pp-miles')?.setAttribute('open', '');
  });
  if (rulesOpen) document.querySelector('.pp-rules')?.setAttribute('open', '');
  document.querySelectorAll('textarea.st-note').forEach(autosize);
  if (DRAWER === 'client' && activeClient()) renderClientDrawer(activeClient());
  else if (DRAWER === 'excel') renderExcelDrawer();
  else if (DRAWER) closeDrawer();
  save();
}
function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

/* ════════ EVENTS ════════ */
function makeClient(d) {
  const id = 'c' + (S.seq++);
  const cl = { id, name: d.name, contact: d.contact || '', email: d.email || '', phone: '',
    quiz: { answers: {}, done: false, rec: null }, planId: null, pkg: null, finalized: false, created: today() };
  S.clients.push(cl);
  return cl;
}
function readIntakeInfo() {
  const f = $('#qzName');
  const name = (f?.value || '').trim();
  if (!name) {
    if (f) {
      f.classList.remove('error'); void f.offsetWidth; f.classList.add('error');
      if (!f.parentElement.querySelector('.err')) {
        const m = document.createElement('span'); m.className = 'err';
        m.textContent = 'A client name is needed to save the build.';
        f.parentElement.appendChild(m);
      }
      f.focus();
    }
    return null;
  }
  const d = { name, contact: ($('#qzContact')?.value || '').trim(), email: ($('#qzEmail')?.value || '').trim() };
  let cl = activeClient();
  if (cl) Object.assign(cl, d); else { cl = makeClient(d); S.activeClient = cl.id; }
  return cl;
}

function handle(el) {
  const act = el.dataset.act;
  const p = (el.dataset.pkg || el.dataset.scope) ? scopedPkg(el) : null;
  const cl = el.dataset.client ? client(el.dataset.client) : activeClient();
  const mi = +el.dataset.mi, ti = +el.dataset.ti, ri = +el.dataset.ri;
  const pi = +el.dataset.pi, si = +el.dataset.si, ai = +el.dataset.ai;
  switch (act) {
    /* navigation */
    case 'goto-home': S.activeClient = null; S.screen = 'home'; HOME_Q = ''; closeDrawer(); break;
    case 'home-lock': HOME_Q = ''; break;
    case 'goto-templates': S.screen = 'templates'; S.designCtx = null; addPop = null; break;
    case 'goto-plans': S.screen = 'plans'; closeDrawer(); break;
    case 'goto-builder': S.screen = 'builder'; INCL_OPEN = false; closeDrawer(); break;
    case 'goto-blueprint': S.screen = 'blueprint'; closeDrawer(); break;
    case 'goto-report': S.screen = 'report'; closeDrawer(); break;
    case 'print': window.print(); return;
    case 'open-excel': openDrawer('excel'); return;
    case 'open-client-drawer': openDrawer('client'); return;
    case 'incl-toggle': INCL_OPEN = !INCL_OPEN; break;
    case 'hint-dismiss': (S.hints || (S.hints = {}))[el.dataset.k] = true; break;
    case 'theme-set': S.theme = el.dataset.theme; break;

    /* home / clients */
    case 'new-project': S.activeClient = null; HOME_Q = ''; QZ = { step: 0, draft: {} }; S.screen = 'intake'; break;
    case 'client-open': openClient(cl); break;
    case 'client-exit':
      toast(`Closed ${cl.name} — pick them from the list to continue later`);
      S.activeClient = null; S.screen = 'home'; closeDrawer();
      break;
    case 'client-del':
      if (confirm(`Remove ${cl.name}? Their tailored build will be lost.`)) {
        S.clients = S.clients.filter(x => x.id !== cl.id);
        if (S.activeClient === cl.id) { S.activeClient = null; S.screen = 'home'; }
        closeDrawer();
      }
      break;

    /* intake / quiz */
    case 'qz-cancel':
      if (cl && cl.pkg) S.screen = 'builder';
      else { S.activeClient = null; S.screen = 'home'; }
      break;
    case 'qz-next':
      if (QZ.step === 0) { if (!readIntakeInfo()) return; QZ.step = 1; }
      else QZ.step++;
      break;
    case 'qz-back': QZ.step = Math.max(0, QZ.step - 1); break;
    case 'qz-skip':
      if (QZ.step === 0 && !readIntakeInfo()) return;
      S.screen = 'plans';
      break;
    case 'qz-pick': cl.quiz.answers[el.dataset.q] = +el.dataset.i; break;
    case 'qz-finish': S.screen = 'plans'; break;
    case 'cd-run-quiz': QZ = { step: 1, draft: {} }; S.screen = 'intake'; closeDrawer(); break;

    /* plan selection */
    case 'plan-select': {
      const id = el.dataset.pkg;
      if (cl.planId === id && cl.pkg) { S.screen = 'builder'; break; }
      if (cl.pkg && !confirm(`Swap ${cl.name} to the ${pkg(id).name} plan? Their current build will start fresh from the ${pkg(id).name} template.`)) return;
      cl.planId = id; cl.pkg = clone(pkg(id)); cl.finalized = false;
      S.screen = 'builder'; INCL_OPEN = false; closeDrawer();
      toast(`${pkg(id).name} plan selected for ${cl.name}`);
      break;
    }
    case 'finalize':
      cl.finalized = true; S.screen = 'blueprint';
      toast('Build finalized — this is the presentation blueprint');
      break;

    /* client drawer fields */
    case 'cd-name': cl.name = el.value.trim() || cl.name; break;
    case 'cd-contact': cl.contact = el.value; break;
    case 'cd-email': cl.email = el.value; break;
    case 'cd-phone': cl.phone = el.value; break;
    case 'cd-quiz': {
      if (el.value === '') delete cl.quiz.answers[el.dataset.q];
      else cl.quiz.answers[el.dataset.q] = +el.value;
      if (Object.keys(cl.quiz.answers).length === QUIZ.length) { cl.quiz.done = true; cl.quiz.rec = quizRec(cl.quiz.answers); }
      break;
    }

    /* add-ons & modules */
    case 'qty': case 'qty-step': {
      const key = { auto: 'extraAutos', integ: 'integrations', ext: 'extInteg' }[el.dataset.kind];
      const cur = p[key] || 0;
      const val = act === 'qty' ? Math.round(+el.value || 0) : cur + +el.dataset.d;
      p[key] = Math.max(0, val);
      break;
    }
    /* Manual "extra automations" quote — overrides the map-derived count until reset to auto. */
    case 'extra-set': p.extraManual = Math.max(0, Math.round(+el.value || 0)); break;
    case 'extra-step': p.extraManual = Math.max(0, (p.extraManual || 0) + (+el.dataset.d || 0)); break;
    case 'form-toggle': p.customForm = el.checked; break;
    case 'opt-toggle': p.milestones[mi].tasks[ti].inc = el.checked; break;

    /* templates admin */
    case 'set-rate': S.rate = Math.max(0, +el.value || 0); break;
    case 'set-credit': S.credit = Math.max(0, +el.value || 0); break;
    /* package settings — progressive accordion + automation library */
    case 'tpl-toggle': TPL.open = (TPL.open === el.dataset.pkg) ? null : el.dataset.pkg; break;
    case 'lib-toggle': TPL.showLib = !TPL.showLib; break;
    case 'auto-edit': TPL.editAuto = (TPL.editAuto === el.dataset.cid) ? null : el.dataset.cid; break;
    case 'auto-add': {
      let i = 1, id; do { id = 'auto-' + i++; } while (S.catalog.some(a => a.id === id));
      S.catalog.push({ id, n: 'New automation', d: '', roles: [] });
      TPL.showLib = true; TPL.editAuto = id;
      break;
    }
    case 'auto-name': { const a = S.catalog.find(x => x.id === el.dataset.cid); if (a) a.n = el.value; break; }
    case 'auto-desc': { const a = S.catalog.find(x => x.id === el.dataset.cid); if (a) a.d = el.value; break; }
    case 'auto-role': {
      const a = S.catalog.find(x => x.id === el.dataset.cid); if (!a) break;
      a.roles = a.roles || [];
      const r = el.dataset.role, i = a.roles.indexOf(r);
      if (i < 0) a.roles.push(r); else a.roles.splice(i, 1);
      break;
    }
    case 'auto-del': {
      const id = el.dataset.cid;
      const a = S.catalog.find(x => x.id === id); if (!a) break;
      const uses = autoUsage(id);
      const msg = uses
        ? `Delete “${a.n}”? It’s attached in ${uses} place${uses === 1 ? '' : 's'} — those stages keep the step, but it leaves the picker and library.`
        : `Delete “${a.n}” from the library?`;
      if (!confirm(msg)) return;
      S.catalog = S.catalog.filter(x => x.id !== id);
      if (TPL.editAuto === id) TPL.editAuto = null;
      break;
    }
    case 'reset-defaults':
      if (confirm('Restore package templates and prices to defaults? Client builds are kept as-is.')) {
        const keep = { clients: S.clients, seq: S.seq, activeClient: S.activeClient, screen: S.screen, catalog: S.catalog };
        S = clone(DEFAULTS); Object.assign(S, keep);
      } else return;
      break;
    case 'mile-name': p.milestones[mi].name = el.value; break;
    case 'mile-del': if (confirm('Delete this milestone and all its lines?')) p.milestones.splice(mi, 1); else return; break;
    case 'mile-add': p.milestones.push({ name: 'New milestone', tasks: [] }); break;
    case 'task-name': p.milestones[mi].tasks[ti].name = el.value; break;
    case 'task-hrs': p.milestones[mi].tasks[ti].hours = Math.max(0, +el.value || 0); break;
    case 'task-opt': { const t = p.milestones[mi].tasks[ti]; t.opt = el.checked; if (!t.opt) t.inc = true; break; }
    case 'task-inc': p.milestones[mi].tasks[ti].inc = el.checked; break;
    case 'task-cust': p.milestones[mi].tasks[ti].cust = el.checked ? undefined : false; break;
    case 'task-clabel': p.milestones[mi].tasks[ti].clabel = el.value; break;
    case 'task-del': p.milestones[mi].tasks.splice(ti, 1); break;
    case 'task-add': p.milestones[mi].tasks.push({ name: 'New task', hours: 1, opt: false, inc: true }); break;
    case 'ret-name': p.retainer[ri].name = el.value; break;
    case 'ret-hrs': p.retainer[ri].hours = Math.max(0, +el.value || 0); break;
    case 'ret-del': p.retainer.splice(ri, 1); break;
    case 'ret-add': p.retainer.push({ name: 'New line', hours: 1 }); break;
    case 'design-open': S.designCtx = { pkgId: el.dataset.pkg }; S.screen = 'design'; addPop = null; closeDrawer(); break;

    /* builder */
    case 'pl-name': p.pipelines[pi].name = el.value; break;
    case 'pl-inflow': p.pipelines[pi].inflow = el.value; break;
    case 'pl-del':
      if (confirm(`Delete the "${p.pipelines[pi].name}" pipeline and its stages?`)) { p.pipelines.splice(pi, 1); addPop = null; } else return;
      break;
    case 'pl-add': p.pipelines.push({ name: 'New pipeline', inflow: '', stages: [{ name: 'New stage', role: 'intake', note: '', autos: [] }] }); break;
    case 'st-name': p.pipelines[pi].stages[si].name = el.value; break;
    case 'st-note': p.pipelines[pi].stages[si].note = el.value; break;
    case 'st-del': {
      const st = p.pipelines[pi].stages[si];
      if (!(st.autos || []).length || confirm(`Delete the "${st.name}" stage and its automations?`)) {
        p.pipelines[pi].stages.splice(si, 1); addPop = null;
      } else return;
      break;
    }
    case 'st-add': p.pipelines[pi].stages.push({ name: 'New stage', role: 'followup', note: '', autos: [] }); break;
    case 'chip-toggle': { const a = p.pipelines[pi].stages[si].autos[ai]; a.on = !a.on; break; }
    case 'chip-del': p.pipelines[pi].stages[si].autos.splice(ai, 1); break;
    case 'pop-open': addPop = { pi, si }; break;
    case 'pop-close': addPop = null; break;
    case 'pop-add': {
      const st = p.pipelines[pi].stages[si];
      if (!(st.autos || []).some(a => a.id === el.dataset.cid)) st.autos.push({ id: el.dataset.cid, on: true });
      break;
    }
    default: return;
  }
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const tag = el.tagName;
  if ((tag === 'INPUT' && el.type !== 'checkbox') || tag === 'SELECT' || tag === 'TEXTAREA') return;
  handle(el);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (el && ['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName)) handle(el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'homeSearch') { HOME_Q = e.target.value; updateHomeResults(); return; }
  if (e.target.classList?.contains('st-note')) autosize(e.target);
  if (e.target.id === 'qzName' && e.target.classList.contains('error')) {
    e.target.classList.remove('error');
    e.target.parentElement.querySelector('.err')?.remove();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (addPop) { addPop = null; render(); }
    else if (DRAWER) closeDrawer();
    else if (S.screen === 'home' && HOME_Q) { HOME_Q = ''; render(); }
  }
  if (e.key === 'Enter' && ['qzName', 'qzContact', 'qzEmail'].includes(e.target.id)) {
    e.preventDefault();
    handle(document.querySelector('[data-act="qz-next"]'));
    return;
  }
  // Quiz question steps: A–D / 1–4 select an option, Enter moves on
  if (S.screen === 'intake' && document.querySelector('.qz-opts') && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) {
    const opts = [...document.querySelectorAll('.qz-opt')];
    const byLetter = 'abcdefgh'.indexOf(e.key.toLowerCase());
    const byNum = parseInt(e.key, 10);
    const pick = byLetter >= 0 && byLetter < opts.length ? byLetter
      : (byNum >= 1 && byNum <= opts.length ? byNum - 1 : -1);
    if (pick >= 0) { e.preventDefault(); opts[pick].click(); return; }
    if (e.key === 'Enter') { const nx = document.querySelector('.qz-nav [data-act="qz-next"]'); if (nx) { e.preventDefault(); nx.click(); } }
  }
});
$('#logoBtn').addEventListener('click', () => { S.activeClient = null; S.screen = 'home'; S.designCtx = null; addPop = null; HOME_Q = ''; closeDrawer(); render(); });
$('#drawerClose').addEventListener('click', closeDrawer);
$('#backdrop').addEventListener('click', closeDrawer);

/* ════════ INIT (with migration from the v1 plan-picker) ════════ */
function migrate() {
  try {
    const raw = localStorage.getItem('rw-plan-picker');
    if (!raw) return;
    const old = JSON.parse(raw);
    (old.clients || []).forEach(oc => {
      if (!oc.pkg) return;
      (oc.pkg.pipelines || []).forEach(pl => pl.stages.forEach(st => { if (st.note == null) st.note = ''; }));
      S.clients.push({
        id: 'c' + (S.seq++), name: oc.name, contact: '', email: '', phone: '',
        quiz: { answers: {}, done: false, rec: null },
        planId: oc.pkg.id, pkg: oc.pkg, finalized: false, created: today(),
      });
    });
    if (old.rate) S.rate = old.rate;
    if (old.credit) S.credit = old.credit;
    localStorage.removeItem('rw-plan-picker');
  } catch (e) {}
}
load();
if (!localStorage.getItem(LS_KEY)) migrate();
render();
</script>
</body>
</html>
